<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117; color: #e6edf3;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 420px;
      background: #161b22; border: 1px solid #30363d;
      border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .logo-wrap { text-align: center; margin-bottom: 16px; }
    .logo {
      width: 72px; height: 72px; border-radius: 16px;
      object-fit: cover; border: 2px solid #30363d;
    }
    .welcome { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { text-align: center; font-size: 15px; color: #7d8590; margin-bottom: 24px; }
    .tab-btns { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 12px 14px; border-radius: 10px; cursor: pointer;
      background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
      font-weight: 600; text-align: center;
    }
    .tab-btn.active { background: #1f6feb; border-color: #1f6feb; }
    .input-group { margin-bottom: 12px; }
    .input-group input {
      width: 100%; padding: 14px 16px; font-size: 16px;
      border: 1px solid #30363d; border-radius: 10px;
      background: #0d1117; color: #e6edf3;
    }
    .input-group input::placeholder { color: #7d8590; }
    .btn {
      width: 100%; padding: 14px 16px; font-size: 16px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer; background: #238636; color: #fff;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-ghost {
      background: #21262d; color: #e6edf3; border: 1px solid #30363d; margin-top: 8px;
    }
    .result { margin-top: 12px; min-height: 22px; text-align: center; font-size: 14px; }
    .error { color: #f85149; }
    .success { color: #3fb950; }
    .info { color: #7d8590; }
    .hidden { display: none; }
    .divider { height: 1px; background: #30363d; margin: 14px 0; }
    .forgot-link {
      display: block; text-align: center; margin-top: 10px;
      color: #58a6ff; text-decoration: none; font-size: 14px;
    }
    .forgot-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logo.PNG" alt="Logo" class="logo">
    </div>
    <div class="welcome">Welcome</div>
    <div class="subtitle">Sign in to continue</div>

    <div class="tab-btns">
      <div id="tab-login" class="tab-btn active">Login</div>
      <div id="tab-signup" class="tab-btn">Sign up</div>
    </div>

    <!-- LOGIN -->
    <div id="pane-login">
      <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="loginPassword" placeholder="Password"></div>
      <button id="loginBtn" class="btn">Login</button>
      <a href="#" id="forgotBtn" class="forgot-link">Forgot password?</a>
      <div id="loginResult" class="result"></div>
    </div>

    <!-- SIGNUP -->
    <div id="pane-signup" class="hidden">
      <div class="input-group"><input type="text" id="signupName" placeholder="Full name"></div>
      <div class="input-group"><input type="email" id="signupEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="signupPassword" placeholder="Password (min 8 chars)"></div>
      <button id="signupBtn" class="btn">Create account</button>
      <div id="signupResult" class="result"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
  <script>
    const { Client, Account, ID } = Appwrite;
    const client = new Client()
      .setEndpoint('https://nyc.cloud.appwrite.io/v1')
      .setProject('mileagelock');

    const account = new Account(client);
    
    // UPDATED NA SA BAGO MONG LINK
    const REDIRECT_URL = "https://mileagetraveltracker.github.io/tool/";
    const RECOVERY_URL = "https://mileagetraveltracker.github.io/tool/";

    // UI refs
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const paneLogin = document.getElementById('pane-login');
    const paneSignup = document.getElementById('pane-signup');

    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginResult = document.getElementById('loginResult');

    const signupName = document.getElementById('signupName');
    const signupEmail = document.getElementById('signupEmail');
    const signupPassword = document.getElementById('signupPassword');
    const signupBtn = document.getElementById('signupBtn');
    const signupResult = document.getElementById('signupResult');

    const forgotBtn = document.getElementById('forgotBtn');

    // AUTO-LOGIN CHECK
    window.addEventListener('load', async () => {
      try {
        await account.get();
        window.location.href = REDIRECT_URL;
      } catch (e) { }
    });

    function showLogin() {
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      paneLogin.classList.remove('hidden');
      paneSignup.classList.add('hidden');
    }
    function showSignup() {
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      paneSignup.classList.remove('hidden');
      paneLogin.classList.add('hidden');
    }
    tabLogin.onclick = showLogin;
    tabSignup.onclick = showSignup;

    // LOGIN
    loginBtn.onclick = async () => {
      loginResult.textContent = '';
      const email = loginEmail.value.trim();
      const pass = loginPassword.value;
      if (!email || !pass) {
        loginResult.innerHTML = '<span class="error">Enter email and password</span>';
        return;
      }
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';
      try {
        await account.createEmailPasswordSession(email, pass);
        loginResult.innerHTML = '<span class="success"><i class="fa-solid fa-circle-check"></i> Success! Redirecting...</span>';
        setTimeout(() => { window.location.href = REDIRECT_URL; }, 700);
      } catch (err) {
        loginResult.innerHTML = `<span class="error">Error: ${err.message || err}</span>`;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    };

    // SIGNUP
    signupBtn.onclick = async () => {
      signupResult.textContent = '';
      const name = signupName.value.trim();
      const email = signupEmail.value.trim();
      const pass = signupPassword.value;
      if (!name || !email || !pass) {
        signupResult.innerHTML = '<span class="error">Fill all fields</span>';
        return;
      }
      if (pass.length < 8) {
        signupResult.innerHTML = '<span class="error">Password must be at least 8 characters</span>';
        return;
      }
      signupBtn.disabled = true;
      signupBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating...';
      try {
        await account.create(ID.unique(), email, pass, name);
        await account.createEmailPasswordSession(email, pass);
        signupResult.innerHTML = '<span class="success"><i class="fa-solid fa-circle-check"></i> Account created! Redirecting...</span>';
        setTimeout(() => { window.location.href = REDIRECT_URL; }, 700);
      } catch (err) {
        signupResult.innerHTML = `<span class="error">Error: ${err.message || err}</span>`;
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create account';
      }
    };

    // FORGOT PASSWORD
    forgotBtn.onclick = async (e) => {
      e.preventDefault();
      loginResult.textContent = '';
      const email = loginEmail.value.trim();
      if (!email) {
        loginResult.innerHTML = '<span class="error">Enter your email first</span>';
        return;
      }
      loginResult.innerHTML = '<span class="info"><i class="fa fa-spinner fa-spin"></i> Sending reset link...</span>';
      try {
        await account.createRecovery(email, RECOVERY_URL);
        loginResult.innerHTML = '<span class="success"><i class="fa-solid fa-circle-check"></i> Reset link sent! Check your email</span>';
      } catch (err) {
        loginResult.innerHTML = `<span class="error">Error: ${err.message || err}</span>`;
      }
    };
  </script>
</body>
</html>
