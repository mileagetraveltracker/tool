<!DOCTYPE html>
<html>
<head>
  <title>Mileage Lock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; 
      background: #0e1116;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .back-arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 28px;
      color: #e6edf3;
      cursor: pointer;
      font-weight: 300;
    }
    .container { 
      width: 100%;
      max-width: 396px; 
      margin-top: 50px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .logo {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 35px auto;
      filter: brightness(0.9);
    }
    .logo img {
      width: 100%;
      height: auto;
    }
    input { 
      width: 100%;
      padding: 16px 18px; 
      margin-bottom: 12px; 
      font-size: 17px; 
      border-radius: 12px; 
      border: 1px solid #30363d; 
      background: #161b22;
      color: #e6edf3;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31,111,235,0.15);
    }
    input::placeholder {
      color: #7d8590;
    }
    .login-btn { 
      background: #1f6feb; 
      color: white; 
      cursor: pointer; 
      font-weight: 600; 
      padding: 14px 16px; 
      margin-top: 8px;
      font-size: 20px; 
      width: 100%; 
      border-radius: 12px; 
      border: none;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: #1a5fd1;
    }
    .login-btn:active {
      transform: scale(0.98);
    }
    #result { 
      margin-top: 14px; 
      font-weight: 500; 
      min-height: 20px;
      text-align: center;
      font-size: 15px;
    }
    .forgot-link {
      color: #2f81f7;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      margin-top: 18px;
      display: inline-block;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .spacer {
      flex: 1;
      min-height: 40px;
    }
    .gc-link {
      display: block;
      width: 100%;
      padding: 14px 16px;
      background: #161b22;
      color: #2f81f7;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 17px;
      border: 1px solid #2f81f7;
      text-align: center;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .gc-link:hover {
      background: #1c2128;
    }
    .footer-note {
      font-size: 13px;
      color: #7d8590;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .footer-note strong {
      color: #e6edf3;
    }
  </style>
</head>
<body>
  <div class="back-arrow">‹</div>
  
  <div class="container">
    <!-- LOGO MO -->
    <div class="logo">
      <img src="./logo.PNG" alt="Mileage Logo">
    </div>
    
    <input type="password" id="passkey" placeholder="Password" autocomplete="off">
    <button class="login-btn" onclick="checkPass()">Log in</button>
    <div id="result"></div>
    
    <!-- NASA ILALIM NA NG LOGIN -->
    <a href="#" class="forgot-link" onclick="alert('Message Charls Darwin to get updated password'); return false;">
      You don't have password?
    </a>
    
    <div class="spacer"></div>
    
    <a href="https://m.me/j/AbYpGq-yLGpGvqNK/?send_source=gc:copy_invite_link_c" 
       class="gc-link" 
       target="_blank">
       Click here to get access
    </a>
    
    <p class="footer-note">
      Password expires monthly.<br>
      Message <strong>@CharlsDarwin</strong> to get password
    </p>
  </div>

  <!-- IPHONE NOTIFICATION SOUND -->
  <audio id="successSound" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_ad4f6752d8.mp3" type="audio/mpeg">
  </audio>

  <script>
    async function checkPass() {
      const passkey = document.getElementById('passkey').value.trim();
      const resultDiv = document.getElementById('result');
      const sound = document.getElementById('successSound');
      
      if (!passkey) {
        resultDiv.innerHTML = "⚠️ Please enter password";
        resultDiv.style.color = "#f85149";
        return;
      }

      resultDiv.innerHTML = "Verifying...";
      resultDiv.style.color = "#7d8590";
      
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passkey })
        });
        
        const data = await res.json();
        
        if (res.status === 200) {
          resultDiv.innerHTML = "✓ Access Granted";
          resultDiv.style.color = "#3fb950";
          
          sound.volume = 1.0;
          sound.currentTime = 0;
          sound.play().catch(e => console.log("Sound blocked"));
          
          setTimeout(() => {
            window.location.href = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";
          }, 1500);
        } else {
          resultDiv.innerHTML = "Wrong password. Try again.";
          resultDiv.style.color = "#f85149";
        }
      } catch (error) {
        resultDiv.innerHTML = "Server error. Try again.";
        resultDiv.style.color = "#f85149";
      }
    }

    document.getElementById('passkey').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPass();
    });
  </script>
</body>
</html>
