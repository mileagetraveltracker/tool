<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mileage Private Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css)">
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/appwrite@13.0.1)"></script>
<style>
/* ========== RESET & BASE ========== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow-x:hidden;overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial;background:#000;color:#e6edf3;display:flex;align-items:center;justify-content:center;position:relative}

/* ========== BACKGROUND HIGHWAY EFFECT ========== */
.highway-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;background:#000;overflow:hidden}
.road-container{position:absolute;top:0;left:0;width:100%;height:100%;perspective:500px}
.road{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,#0a0a0a,#1a1a1a);transform:rotateX(60deg);transform-origin:center bottom}
.lane-lines{position:absolute;bottom:-50%;left:50%;width:20px;height:250%;background:repeating-linear-gradient(to top,transparent 0,transparent 30px,#fff 30px,#fff 70px);animation:moveRoad .25s linear infinite}
@keyframes moveRoad{0%{transform:translateX(-50%)translateY(0)}100%{transform:translateX(-50%)translateY(70px)}}

/* ========== CONTAINER ========== */
.container{width:100%;height:100%;max-width:100vw;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;background:rgba(0,0,0,.85);padding:20px;text-align:center}
.form-wrapper{width:100%;max-width:380px;margin:0 auto;padding:0 12px}

/* ========== LOGO ========== */
.logo{width:100%;max-width:260px;margin:-10px auto 18px;padding:14px;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:auto;object-fit:contain;display:block}

/* ========== INPUTS ========== */
.input-group{position:relative;width:100%}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6e7681;font-size:14px;pointer-events:none}
input,textarea{width:100%;padding:13px 46px 13px 42px;font-size:15px;border-radius:10px;border:1px solid #30363d;background:rgba(22,27,34,.95);color:#e6edf3;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,.15)}
::placeholder{color:#6e7681}

/* ========== PASSWORD TOGGLE ========== */
.password-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#6e7681;z-index:10;padding:6px;user-select:none}
.password-toggle:active{transform:translateY(-50%)scale(.9);color:#58a6ff}

/* ========== BUTTON ========== */
.dispatch-btn{border:0;background:#1a1a1a;height:50px;min-width:180px;padding:0 24px;border-radius:32px;cursor:pointer;border:1px solid #30363d;transition:transform .3s ease;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.dispatch-btn:active{transform:scale(.97)}
.dispatch-btn:disabled{opacity:.6;cursor:not-allowed}
.dispatch-btn .car{position:absolute;left:-40px;top:50%;transform:translateY(-50%);width:32px;height:18px;background:#e6edf3;border-radius:4px;transition:left .8s cubic-bezier(.65,0,.35,1);opacity:0}
.dispatch-btn .car::before{content:'';position:absolute;right:-6px;top:3px;width:10px;height:12px;background:#58a6ff;border-radius:2px;box-shadow:0 0 15px rgba(88,166,255,1)}
.dispatch-btn .road-dash{position:absolute;top:50%;left:12px;right:12px;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(to right,transparent 0,transparent 6px,#fff 6px,#fff 12px);opacity:0;transition:opacity .2s}
.dispatch-btn .btn-text{position:relative;z-index:2;font-weight:600;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px}
.dispatch-btn.loading .car{left:12px;opacity:1;animation:carDrive .8s cubic-bezier(.65,0,.35,1) forwards}
.dispatch-btn.loading .road-dash{opacity:1;animation:roadMove .3s linear infinite}
.dispatch-btn.loading .btn-text{opacity:0}
@keyframes carDrive{to{left:calc(100% - 44px)}}
@keyframes roadMove{100%{background-position:12px 0}}

/* ========== TEXT FEEDBACK ========== */
#result,#signupResult,#resetResult,#contactResult{font-weight:500;min-height:16px;text-align:center;font-size:12px;margin-top:4px}

/* ========== LINKS & FOOTER ========== */
.link-btn{color:#58a6ff;font-size:13px;cursor:pointer;padding:7px 4px;user-select:none;display:block}
.link-btn:active{opacity:.7}
.link-btn.support{color:#7d8590;font-size:12px}
.support-email{color:#7d8590;font-size:11px;margin-top:6px}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){.logo{max-width:240px}}
@media(max-height:600px){.container{justify-content:flex-start;padding-top:20px}}
</style>
</head>
<body>
<div class="highway-bg">
  <div class="road-container"><div class="road"><div class="lane-lines"></div></div></div>
</div>

<div class="container">
  <div class="form-wrapper">
    <div class="logo"><img src="./logo.PNG" alt="Mileage Logo"></div>

    <!-- LOGIN -->
    <div id="loginForm" class="form-box">
      <div class="input-group">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <div class="password-toggle" id="loginPasswordToggle"><i class="fa-solid fa-lock" id="login-password-icon"></i></div>
      </div>
      <button class="dispatch-btn" id="loginBtn">
        <div class="car"></div><div class="road-dash"></div>
        <div class="btn-text"><i class="fa-solid fa-right-to-bracket"></i> LOG IN</div>
      </button>
      <div id="result"></div>
      <p class="link-btn" onclick="showSignup()"><i class="fa-solid fa-user-plus"></i> Don't have an account? Create one</p>
      <p class="link-btn" onclick="forgotPass()"><i class="fa-solid fa-key"></i> Forgot password?</p>
      <p class="link-btn support" onclick="showContact()"><i class="fa-solid fa-headset"></i> No access to email? Contact support</p>
    </div>

    <!-- SIGNUP -->
    <div id="signupForm" class="form-box hidden">
      <div class="input-group"><i class="fa-solid fa-user input-icon"></i><input type="text" id="signupName" placeholder="Full Name" autocomplete="name"></div>
      <div class="input-group"><i class="fa-solid fa-envelope input-icon"></i><input type="email" id="signupEmail" placeholder="Email Address" autocomplete="email"></div>
      <div class="input-group"><i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="signupPassword" placeholder="Password (min 8 chars)" autocomplete="new-password">
        <div class="password-toggle" id="signupPasswordToggle"><i class="fa-solid fa-lock" id="signup-password-icon"></i></div>
      </div>
      <button class="dispatch-btn" id="signupBtn">
        <div class="car"></div><div class="road-dash"></div>
        <div class="btn-text"><i class="fa-solid fa-user-plus"></i> CREATE ACCOUNT</div>
      </button>
      <div id="signupResult"></div>
      <p class="link-btn" onclick="showLogin()"><i class="fa-solid fa-right-to-bracket"></i> Already have an account? Log in</p>
    </div>

    <!-- RESET PASSWORD -->
    <div id="resetForm" class="form-box hidden">
      <div class="input-group"><i class="fa-solid fa-lock input-icon"></i><input type="password" id="newPassword" placeholder="New Password (min 8 chars)" autocomplete="new-password"></div>
      <div class="input-group"><i class="fa-solid fa-lock input-icon"></i><input type="password" id="confirmPassword" placeholder="Confirm New Password" autocomplete="new-password"></div>
      <button class="dispatch-btn" id="resetBtn">
        <div class="car"></div><div class="road-dash"></div>
        <div class="btn-text"><i class="fa-solid fa-check"></i> UPDATE PASSWORD</div>
      </button>
      <div id="resetResult"></div>
    </div>

    <!-- CONTACT SUPPORT -->
    <div id="contactForm" class="form-box hidden">
      <div class="input-group"><i class="fa-solid fa-user input-icon"></i><input type="text" id="contactName" placeholder="Your Name" autocomplete="name"></div>
      <div class="input-group"><i class="fa-solid fa-envelope input-icon"></i><input type="email" id="contactEmail" placeholder="Your Email" autocomplete="email"></div>
      <div class="input-group"><i class="fa-solid fa-tag input-icon"></i><input type="text" id="contactSubject" placeholder="Subject" autocomplete="off"></div>
      <div class="input-group"><i class="fa-solid fa-message input-icon" style="top:24px"></i><textarea id="contactMessage" placeholder="Your message..." autocomplete="off"></textarea></div>
      <button class="dispatch-btn" id="contactBtn"><div class="car"></div><div class="road-dash"></div><div class="btn-text"><i class="fa-solid fa-paper-plane"></i> SEND MESSAGE</div></button>
      <div id="contactResult"></div>
      <p class="support-email">Or email us directly: helpcenter.mileage@gmail.com</p>
      <p class="link-btn" onclick="showLogin()"><i class="fa-solid fa-arrow-left"></i> Back to Login</p>
    </div>
  </div>
</div>

<script>
const PROJECT_ID="mileagelock";
const API_ENDPOINT="[nyc.cloud.appwrite.io](https://nyc.cloud.appwrite.io/v1)";
const REDIRECT_URL="[charlsdarwin2004.github.io](https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563)";
const RECOVERY_URL=window.location.origin+window.location.pathname;
const SUPPORT_EMAIL="helpcenter.mileage@gmail.com";

const {Client,Account,ID}=Appwrite;
const client=new Client().setEndpoint(API_ENDPOINT).setProject(PROJECT_ID);
const account=new Account(client);

/* ========== INIT ========== */
window.addEventListener("load",()=>{
 const params=new URLSearchParams(location.search);
 const userId=params.get("userId"),secret=params.get("secret");
 toggleForms(userId&&secret?"reset":"login");
 setupToggle("loginPassword","loginPasswordToggle","login-password-icon");
 setupToggle("signupPassword","signupPasswordToggle","signup-password-icon");
});

function setupToggle(inputId,toggleId,iconId){
 const toggle=document.getElementById(toggleId);
 const input=document.getElementById(inputId);
 const icon=document.getElementById(iconId);
 toggle.addEventListener("click",()=>{
   const visible=input.type==="password";
   input.type=visible?"text":"password";
   icon.classList.toggle("fa-lock",!visible);
   icon.classList.toggle("fa-lock-open",visible);
   input.focus();
 });
}

function toggleForms(target){
 ["login","signup","reset","contact"].forEach(id=>{
   document.getElementById(id+"Form").classList.toggle("hidden",id!==target);
 });
 ["result","signupResult","resetResult","contactResult"].forEach(id=>document.getElementById(id).textContent="");
}

/* LOGIN */
document.getElementById("loginBtn").onclick=async()=>{
 const email=loginEmail.value.trim(),pass=loginPassword.value;
 const r=result,btn=loginBtn;
 if(!email||!pass)return showErr(r,"Fill all fields");
 await runAction(btn,r,"Dispatching...",async()=>{
   await account.deleteSessions().catch(()=>{});
   await account.createEmailSession(email,pass);
   showOk(r,"Access Granted");
   setTimeout(()=>location.href=REDIRECT_URL,800);
 },()=>showErr(r,"Wrong email or password"));
};

/* SIGNUP */
document.getElementById("signupBtn").onclick=async()=>{
 const name=signupName.value.trim(),email=signupEmail.value.trim(),pass=signupPassword.value;
 const r=signupResult,btn=signupBtn;
 if(!name||!email||!pass)return showErr(r,"Fill all fields");
 if(pass.length<8)return showErr(r,"Password min 8 characters");
 await runAction(btn,r,"Creating account...",async()=>{
   await account.create(ID.unique(),email,pass,name);
   showOk(r,"Account created! Please log in");
   setTimeout(()=>{toggleForms("login");loginEmail.value=email;showOk(result,"Account created! Enter password to log in");},1800);
 },e=>showErr(r,e.message.includes("already exists")?"Email already used":e.message));
};

/* FORGOT PASSWORD */
async function forgotPass(){
 const email=loginEmail.value.trim(),r=result;
 if(!email)return showErr(r,"Enter your email first");
 await runAction(null,r,"Sending reset link...",async()=>{
   await account.createRecovery(email,RECOVERY_URL);
   showOk(r,"Reset link sent to email");
 },e=>showErr(r,e.message));
}

/* RESET PASSWORD */
document.getElementById("resetBtn").onclick=async()=>{
 const np=newPassword.value,cp=confirmPassword.value;
 const r=resetResult,btn=resetBtn;
 const p=new URLSearchParams(location.search);
 const uid=p.get("userId"),sec=p.get("secret");
 if(!np||!cp)return showErr(r,"Fill all fields");
 if(np.length<8)return showErr(r,"Password min 8 characters");
 if(np!==cp)return showErr(r,"Passwords do not match");
 await runAction(btn,r,"Updating password...",async()=>{
   await account.updateRecovery(uid,sec,np,cp);
   showOk(r,"Password updated! Please log in");
   setTimeout(()=>{history.replaceState({},document.title,location.pathname);toggleForms("login");showOk(result,"Password updated! Please log in");},1800);
 },e=>showErr(r,e.message));
};

/* CONTACT SUPPORT */
document.getElementById("contactBtn").onclick=async()=>{
 const name=contactName.value.trim(),email=contactEmail.value.trim(),sub=contactSubject.value.trim(),msg=contactMessage.value.trim(),r=contactResult,btn=contactBtn;
 if(!name||!email||!sub||!msg)return showErr(r,"Fill all fields");
 await runAction(btn,r,"Sending message...",async()=>{
   const res=await fetch("[formsubmit.co](https://formsubmit.co/ajax/)"+SUPPORT_EMAIL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name,email,_subject:"[MileageLock Support] "+sub,message:msg,_captcha:"false",_template:"table"})});
   if(res.ok){showOk(r,"Message sent! We'll reply soon.");contactForm.reset?.();}
   else throw new Error("Failed");
 },()=>showErr(r,"Failed to send. Email us directly at "+SUPPORT_EMAIL));
};

/* HELPERS */
function showOk(el,txt){el.innerHTML='<i class="fa-solid fa-circle-check"></i> '+txt;el.style.color="#3fb950"}
function showErr(el,txt){el.innerHTML='<i class="fa-solid fa-circle-xmark"></i> '+txt;el.style.color="#f85149"}
async function runAction(btn,el,msg,fn,fail){
 if(btn)btn.disabled=true,btn.classList.add("loading");
 el.innerHTML='<i class="fa fa-spinner fa-spin"></i> '+msg;el.style.color="#7d8590";
 try{await fn();}catch(e){fail(e);}finally{if(btn)btn.disabled=false,btn.classList.remove("loading");}
}
</script>
</body>
</html>
