<!DOCTYPE html>
<html>
<head>
  <title>Mileage Private Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .back-arrow { position: absolute; top: 20px; left: 20px; font-size: 28px; color: #7d8590; cursor: pointer; font-weight: 300; }
    .container { width: 100%; max-width: 396px; margin-top: 40px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .logo { width: 100%; max-width: 240px; margin: 0 auto 40px auto; padding: 20px; background: #ffffff; border-radius: 16px; }
    .logo img { width: 100%; height: auto; display: block; }
    input { width: 100%; padding: 16px 18px; margin-bottom: 12px; font-size: 17px; border-radius: 12px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; outline: none; transition: all 0.2s; }
    input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,0.15); }
    input::placeholder { color: #6e7681; }
    .login-btn { background: #238636; color: white; cursor: pointer; font-weight: 600; padding: 14px 16px; margin-top: 8px; font-size: 18px; width: 100%; border-radius: 12px; border: none; transition: background 0.2s; }
    .login-btn:hover { background: #2ea043; }
    .login-btn:active { transform: scale(0.98); }
    #result { margin-top: 8px; margin-bottom: 0; font-weight: 500; min-height: 20px; text-align: center; font-size: 15px; }
    .forgot-link { color: #58a6ff; font-size: 15px; font-weight: 400; text-decoration: none; margin-top: 4px; display: inline-block; }
    .forgot-link:hover { text-decoration: underline; }
    .spacer { flex: 1; min-height: 60px; }
    .gc-link { display: block; width: 100%; padding: 14px 16px; background: transparent; color: #58a6ff; text-decoration: none; border-radius: 12px; font-weight: 500; font-size: 16px; border: 1px solid #30363d; text-align: center; transition: all 0.2s; margin-bottom: 20px; }
    .gc-link:hover { background: #161b22; border-color: #58a6ff; }
    .footer-note { font-size: 12px; color: #6e7681; text-align: center; line-height: 1.5; margin-bottom: 20px; }
    .footer-note strong { color: #e6edf3; }
  </style>
</head>
<body>
  <div class="back-arrow">‹</div>
  <div class="container">
    <div class="logo">
      <img src="./logo.PNG" alt="Mileage Logo">
    </div>
    <input type="password" id="passkey" placeholder="Password" autocomplete="off">
    <button class="login-btn" onclick="checkPass()">LOG IN</button>
    <div id="result"></div>
    <a href="#" class="forgot-link" onclick="alert('Message @CharlsDarwin to get updated password'); return false;">
      You don't have password?
    </a>
    <div class="spacer"></div>
    <a href="https://m.me/j/AbYpGq-yLGpGvqNK/?send_source=gc:copy_invite_link_c" class="gc-link" target="_blank">
      Click here to get access
    </a>
    <p class="footer-note">
      Password is valid only for 1month.<br>
      if your password is expired message <strong>@CharlsDarwin</strong> to get new password
    </p>
  </div>

  <audio id="successSound" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_ad4f6752d8.mp3" type="audio/mpeg">
  </audio>

  <script>
    const PUBLIC_PASS = "GCMILEAGE2026";
    const ADMIN_PASS = "Darwengots200412*";
    const REDIRECT_URL = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=chrlsdrwn";

    function checkPass() {
      const passkey = document.getElementById('passkey').value.trim();
      const resultDiv = document.getElementById('result');
      const sound = document.getElementById('successSound');

      if (!passkey) {
        resultDiv.innerHTML = "⚠️ Please enter password";
        resultDiv.style.color = "#f85149";
        return;
      }

      resultDiv.innerHTML = "Verifying...";
      resultDiv.style.color = "#7d8590";

      if (passkey === PUBLIC_PASS || passkey === ADMIN_PASS) {
        resultDiv.innerHTML = "✓ Access Granted";
        resultDiv.style.color = "#3fb950";
        sound.volume = 1.0;
        sound.currentTime = 0;
        sound.play().catch(e => console.log("Sound blocked"));
        
        setTimeout(() => {
          window.location.href = REDIRECT_URL;
        }, 1500);
      } else {
        resultDiv.innerHTML = "Wrong password. Try again.";
        resultDiv.style.color = "#f85149";
        document.getElementById('passkey').value = "";
      }
    }

    document.getElementById('passkey').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPass();
    });
  </script>
</body>
</html>
