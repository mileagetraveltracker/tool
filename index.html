<!DOCTYPE html>
<html>
<head>
  <title>Mileage Lock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; background: #0a0a0a; color: #fff; text-align: center; margin-top: 50px; }
    .container { max-width: 400px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 10px; }
    input, button { padding: 15px; margin: 10px 0; font-size: 16px; width: 100%; box-sizing: border-box; border-radius: 5px; border: none; }
    button { background: #0070f3; color: white; cursor: pointer; font-weight: bold; }
    #result { margin-top: 20px; font-weight: bold; min-height: 24px; }
    .note { font-size: 12px; color: #888; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Mileage Private Tools</h1>
    <p>Enter monthly passkey to continue</p>
    <input type="password" id="passkey" placeholder="Enter Passkey" autocomplete="off">
    <br>
    <button onclick="checkPass()">Unlock Access</button>
    <div id="result"></div>
    <p class="note">Passkey expires monthly. Contact admin if denied.</p>
  </div>

  <script>
    async function checkPass() {
      const passkey = document.getElementById('passkey').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!passkey) {
        resultDiv.innerHTML = "⚠️ Please enter a passkey";
        resultDiv.style.color = "#ff0";
        return;
      }

      resultDiv.innerHTML = "Verifying...";
      resultDiv.style.color = "#fff";
      
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passkey })
        });
        
        const data = await res.json();
        
        if (res.status === 200) {
          resultDiv.innerHTML = "✅ Access Granted! Redirecting...";
          resultDiv.style.color = "#0f0";
          setTimeout(() => {
            window.location.href = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";
          }, 1000);
        } else {
          resultDiv.innerHTML = "❌ " + data.error;
          resultDiv.style.color = "#f00";
        }
      } catch (error) {
        resultDiv.innerHTML = "❌ Server error. Try again.";
        resultDiv.style.color = "#f00";
      }
    }

    document.getElementById('passkey').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPass();
    });
  </script>
</body>
</html>
