<!DOCTYPE html>

<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; 
      background: #000000; 
      color: #e6edf3; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    /* POV HIGHWAY - GAMIT CSS GRADIENT, WALANG LAG */
    .highway-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: #0a0a0a;
      overflow: hidden;
    }
    
    /* ROAD SURFACE WITH PERSPECTIVE - PERO LIGHTWEIGHT */
    .road-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150%;
      height: 200%;
      transform: translate(-50%, -50%) perspective(600px) rotateX(60deg);
      transform-origin: center bottom;
    }
    
    .road {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
    }
    
    /* WHITE LANE LINES - NAKA-POV, PAPALAYO */
    .lane-lines {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 12px;
      height: 200%;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        to top,
        transparent 0px,
        transparent 20px,
        #ffffff 20px,
        #ffffff 60px
      );
      animation: moveRoad 0.6s linear infinite;
      will-change: transform;
    }
    
    /* ROAD SIDES PARA MUKHANG TUNAY NA HIGHWAY */
    .road::before,
    .road::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(to top, #0a0a0a 0%, transparent 100%);
    }
    .road::before { left: 0; }
    .road::after { right: 0; }
    
    @keyframes moveRoad {
      0% { transform: translateX(-50%) translateY(0); }
      100% { transform: translateX(-50%) translateY(60px); }
    }
    
    /* DARK OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1;
    }
    
    .back-arrow { position: absolute; top: 20px; left: 20px; font-size: 28px; color: #7d8590; cursor: pointer; font-weight: 300; z-index: 3; }
    .container { width: 100%; max-width: 396px; margin-top: 40px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 3; }
    
    .logo { 
      width: 100%; 
      max-width: 320px; 
      margin: 0 auto 40px auto; 
      padding: 24px; 
      background: #ffffff; 
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    .logo img { width: 100%; height: auto; display: block; }
    
    input { width: 100%; padding: 16px 18px; margin-bottom: 12px; font-size: 17px; border-radius: 12px; border: 1px solid #30363d; background: rgba(22,27,34,0.95); color: #e6edf3; outline: none; transition: all 0.2s; backdrop-filter: blur(10px); }
    input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,0.15); }
    input::placeholder { color: #6e7681; }
    .login-btn { background: #238636; color: white; cursor: pointer; font-weight: 600; padding: 14px 16px; margin-top: 8px; font-size: 18px; width: 100%; border-radius: 12px; border: none; transition: background 0.2s; }
    .login-btn:hover { background: #2ea043; }
    .login-btn:active { transform: scale(0.98); }
    #result { margin-top: 8px; margin-bottom: 0; font-weight: 500; min-height: 20px; text-align: center; font-size: 15px; }
    .forgot-link { color: #58a6ff; font-size: 15px; font-weight: 400; text-decoration: none; margin-top: 4px; display: inline-block; }
    .forgot-link:hover { text-decoration: underline; }
    
    .social-wrapper { display: flex; justify-content: center; gap: 15px; margin: 20px 0 10px 0; list-style: none; }
    .social-wrapper a { text-decoration: none; }
    .social-wrapper .icon { position: relative; width: 45px; height: 45px; border-radius: 50%; background: rgba(22,27,34,0.95); border: 1px solid #30363d; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); }
    .social-wrapper .icon:hover { background: #238636; transform: translateY(-5px); }
    .social-wrapper .icon i { font-size: 20px; color: #7d8590; }
    .social-wrapper .icon:hover i { color: white; }
    .social-wrapper .tooltip { position: absolute; top: -40px; background: #238636; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; opacity: 0; pointer-events: none; transition: all 0.3s; white-space: nowrap; }
    .social-wrapper .icon:hover .tooltip { opacity: 1; top: -45px; }
    .tooltip::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 5px solid #238636; }
    
    .spacer { flex: 1; min-height: 20px; }
    .gc-link { display: block; width: 100%; padding: 14px 16px; background: rgba(22,27,34,0.95); color: #58a6ff; text-decoration: none; border-radius: 12px; font-weight: 500; font-size: 16px; border: 1px solid #30363d; text-align: center; transition: all 0.2s; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .gc-link:hover { background: rgba(22,27,34,1); border-color: #58a6ff; }
    .footer-note { font-size: 12px; color: #6e7681; text-align: center; line-height: 1.5; margin-bottom: 20px; }
    .footer-note strong { color: #e6edf3; }
  </style>
