<!DOCTYPE html>
<html>
<head>
  <title>Mileage Private Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; background: #000000; color: #e6edf3; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); position: relative; }
    .highway-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: #000000; overflow: hidden; }
    .road-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; perspective: 500px; }
    .road { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%); transform: rotateX(60deg); transform-origin: center bottom; }
    .lane-lines { position: absolute; bottom: -50%; left: 50%; width: 20px; height: 250%; background: repeating-linear-gradient(to top, transparent 0px, transparent 30px, #ffffff 30px, #ffffff 70px); animation: moveRoad 0.25s linear infinite; will-change: transform; }
    @keyframes moveRoad { 0% { transform: translateX(-50%) translateY(0); } 100% { transform: translateX(-50%) translateY(70px); } }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 1; }
    .container { width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 3; gap: 8px; }
    .logo { width: 100%; max-width: 240px; margin: 0 auto 12px auto; padding: 14px; background: #ffffff; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); animation: logoPop 0.6s ease-out; }
    @keyframes logoPop { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    .logo img { width: 100%; height: auto; display: block; }
    input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px; border: 1px solid #30363d; background: rgba(22,27,34,0.95); color: #e6edf3; outline: none; transition: all 0.2s; backdrop-filter: blur(10px); margin-bottom: 6px; }
    input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,0.15); }
    input::placeholder { color: #6e7681; }
    .login-btn { background: #238636; color: white; cursor: pointer; font-weight: 600; padding: 12px 14px; margin-top: 2px; font-size: 16px; width: 100%; border-radius: 10px; border: none; transition: all 0.2s; box-shadow: 0 4px 20px rgba(35,134,54,0.4); }
    .login-btn:hover { background: #2ea043; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #result { margin-top: 2px; font-weight: 500; min-height: 18px; text-align: center; font-size: 13px; }
    .toggle-form, .forgot { color: #58a6ff; font-size: 13px; cursor: pointer; margin-top: 8px; }
    .toggle-form:hover, .forgot:hover { text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="highway-bg">
    <div class="road-container">
      <div class="road">
        <div class="lane-lines"></div>
      </div>
    </div>
  <div class="overlay"></div>
  <div class="container">
    <div class="logo">
      <img src="./logo.PNG" alt="Mileage Logo">
    </div>
    
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <button class="login-btn" id="loginBtn">LOG IN</button>
      <div id="result"></div>
      <p class="forgot" onclick="forgotPass()">Forgot Password?</p>
      <p class="toggle-form" onclick="toggleForms()">Don't have account? Create one</p>
    </div>

    <div id="signupForm" class="hidden">
      <input type="text" id="signupName" placeholder="Full Name" autocomplete="name">
      <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password (min 8 chars)" autocomplete="new-password">
      <button class="login-btn" id="signupBtn">CREATE ACCOUNT</button>
      <div id="signupResult"></div>
      <p class="toggle-form" onclick="toggleForms()">Already have account? Log in</p>
    </div>
  </div>

  <script>
    const PROJECT_ID = 'mileagetool';
    const API_ENDPOINT = 'https://sgp.cloud.appwrite.io/v1';
    const REDIRECT_URL = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";
    
    const { Client, Account, ID } = Appwrite;
    const client = new Client().setEndpoint(API_ENDPOINT).setProject(PROJECT_ID);
    const account = new Account(client);

    account.get().then(() => {
      window.location.href = REDIRECT_URL;
    }).catch(() => {});

    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('loginBtn');
      
      btn.disabled = true;
      resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';
      resultDiv.style.color = "#7d8590";
      
      try {
        await account.createEmailPasswordSession(email, password);
        resultDiv.innerHTML = "✓ Access Granted";
        resultDiv.style.color = "#3fb950";
        setTimeout(() => window.location.href = REDIRECT_URL, 1000);
      } catch (error) {
        resultDiv.innerHTML = "Wrong email or password";
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
      }
    };

    document.getElementById('signupBtn').onclick = async () => {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const resultDiv = document.getElementById('signupResult');
      const btn = document.getElementById('signupBtn');
      
      btn.disabled = true;
      resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account...';
      resultDiv.style.color = "#7d8590";
      
      try {
        await account.create(ID.unique(), email, password, name);
        await account.createEmailPasswordSession(email, password);
        resultDiv.innerHTML = "✓ Account created!";
        resultDiv.style.color = "#3fb950";
        setTimeout(() => window.location.href = REDIRECT_URL, 1000);
      } catch (error) {
        resultDiv.innerHTML = error.message.includes('already exists') ? "Email already used" : error.message;
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
      }
    };

    async function forgotPass() {
      const email = document.getElementById('loginEmail').value;
      const resultDiv = document.getElementById('result');
      
      if (!email) {
        resultDiv.innerHTML = "Enter your email first";
        resultDiv.style.color = "#f85149";
        return;
      }
      
      try {
        await account.createRecovery(email, 'https://mileage-lock.vercel.app');
        resultDiv.innerHTML = "✓ Reset link sent to email";
        resultDiv.style.color = "#3fb950";
      } catch (error) {
        resultDiv.innerHTML = "Error: " + error.message;
        resultDiv.style.color = "#f85149";
      }
    }

    function toggleForms() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('signupForm').classList.toggle('hidden');
    }
  </script>
</body>
</html>
