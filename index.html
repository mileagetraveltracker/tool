<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mileage Private Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow-x: hidden; overflow-y: auto; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; 
            background: #000000; 
            color: #e6edf3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* Background Animation */
        .highway-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; background: #000000; overflow: hidden; }
        .road-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; perspective: 500px; }
        .road { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%); 
            transform: rotateX(60deg); transform-origin: center bottom;
        }
        .lane-lines { 
            position: absolute; bottom: -50%; left: 50%; width: 20px; height: 250%; 
            background: repeating-linear-gradient(to top, transparent 0px, transparent 30px, #ffffff 30px, #ffffff 70px); 
            animation: moveRoad 0.25s linear infinite; 
        }
        @keyframes moveRoad { 0% { transform: translateX(-50%) translateY(0); } 100% { transform: translateX(-50%) translateY(70px); } }

        /* Form Container */
        .container { 
            width: 100%; min-height: 100vh; position: relative; z-index: 10; 
            display: flex; flex-direction: column; justify-content: center; 
            padding: 20px; background: rgba(0, 0, 0, 0.85);
        }
        .form-wrapper { width: 100%; max-width: 360px; margin: 0 auto; }

        .logo { 
            width: 100%; max-width: 260px; margin: 0 auto 20px auto; padding: 14px; 
            background: #ffffff; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.9);
        }
        .logo img { width: 100%; height: auto; display: block; object-fit: contain; }

        .input-group { position: relative; width: 100%; margin-bottom: 10px; }
        .input-group .input-icon { 
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%); 
            color: #6e7681; font-size: 14px; z-index: 2; pointer-events: none;
        }
        input, textarea { 
            width: 100%; padding: 13px 46px 13px 42px; font-size: 15px; border-radius: 10px; 
            border: 1px solid #30363d; background: rgba(22,27,34,0.95); color: #e6edf3; outline: none;
        }
        input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,0.15); }
        
        .password-toggle { 
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%); 
            cursor: pointer; color: #6e7681; z-index: 10; padding: 6px;
        }

        /* Button Animation */
        .dispatch-btn { 
            width: 100%; height: 50px; background: #1a1a1a; cursor: pointer; border-radius: 32px;
            border: 1px solid #30363d; position: relative; overflow: hidden; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; transition: transform 0.2s;
        }
        .dispatch-btn:active { transform: scale(0.97); }
        .dispatch-btn.loading .btn-text { opacity: 0; }
        
        .car { 
            position: absolute; left: -40px; top: 50%; transform: translateY(-50%); 
            width: 30px; height: 15px; background: #e6edf3; border-radius: 3px; opacity: 0;
        }
        .dispatch-btn.loading .car { 
            opacity: 1; animation: carDrive 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; 
        }
        @keyframes carDrive { 0% { left: 10%; } 100% { left: 85%; } }

        .btn-text { color: white; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .hidden { display: none !important; }
        .link-btn { color: #58a6ff; font-size: 13px; cursor: pointer; margin-top: 10px; text-align: center; }
        #result, #signupResult { font-size: 13px; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>

<div class="highway-bg">
    <div class="road-container">
        <div class="road"><div class="lane-lines"></div></div>
    </div>
</div>

<div class="container">
    <div class="form-wrapper">
        <div class="logo">
            <img src="./logo.PNG" alt="Logo">
        </div>

        <div id="loginForm" class="form-box">
            <div class="input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="loginEmail" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="loginPassword" placeholder="Password">
                <div class="password-toggle" id="loginToggle"><i class="fa-solid fa-eye" id="loginEye"></i></div>
            </div>
            <button class="dispatch-btn" id="loginBtn">
                <div class="car"></div>
                <div class="btn-text">LOG IN</div>
            </button>
            <div id="result"></div>
            <p class="link-btn" onclick="showSignup()">Create Account</p>
            <p class="link-btn" onclick="forgotPass()">Forgot Password?</p>
        </div>

        <div id="signupForm" class="form-box hidden">
            <div class="input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="signupName" placeholder="Full Name">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="signupEmail" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="signupPassword" placeholder="Password (8+ chars)">
                <div class="password-toggle" id="signupToggle"><i class="fa-solid fa-eye" id="signupEye"></i></div>
            </div>
            <button class="dispatch-btn" id="signupBtn">
                <div class="car"></div>
                <div class="btn-text">REGISTER</div>
            </button>
            <div id="signupResult"></div>
            <p class="link-btn" onclick="showLogin()">Back to Login</p>
        </div>

        <div id="resetForm" class="form-box hidden">
            <div class="input-group"><input type="password" id="newPass" placeholder="New Password"></div>
            <button class="dispatch-btn" id="resetBtn"><div class="btn-text">UPDATE PASSWORD</div></button>
            <div id="resetResult"></div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const PROJECT_ID = 'mileagelock'; 
    const API_ENDPOINT = 'https://nyc.cloud.appwrite.io/v1';
    const REDIRECT_URL = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";

    const { Client, Account, ID } = Appwrite;
    const client = new Client().setEndpoint(API_ENDPOINT).setProject(PROJECT_ID);
    const account = new Account(client);

    // Initial Load Logic
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('userId') && urlParams.get('secret')) {
            showForm('resetForm');
        }
        setupToggle('loginPassword', 'loginToggle', 'loginEye');
        setupToggle('signupPassword', 'signupToggle', 'signupEye');
    };

    function showForm(id) {
        document.querySelectorAll('.form-box').forEach(b => b.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
    function showSignup() { showForm('signupForm'); }
    function showLogin() { showForm('loginForm'); }

    function setupToggle(inputId, toggleId, eyeId) {
        document.getElementById(toggleId).onclick = () => {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            eye.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        };
    }

    // Login Action
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        const res = document.getElementById('result');

        if (!email || !pass) { res.innerText = "Please fill all fields"; return; }

        btn.classList.add('loading');
        try {
            await account.deleteSessions().catch(() => {});
            // Use createEmailPasswordSession for modern Appwrite
            await account.createEmailPasswordSession(email, pass);
            res.style.color = "#3fb950";
            res.innerText = "Access Granted. Redirecting...";
            setTimeout(() => window.location.href = REDIRECT_URL, 1200);
        } catch (e) {
            btn.classList.remove('loading');
            res.style.color = "#f85149";
            res.innerText = "Invalid credentials or network error";
        }
    };

    // Registration Action
    document.getElementById('signupBtn').onclick = async () => {
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const pass = document.getElementById('signupPassword').value;
        const res = document.getElementById('signupResult');

        if (pass.length < 8) { res.innerText = "Password must be 8+ chars"; return; }

        try {
            await account.create(ID.unique(), email, pass, name);
            res.style.color = "#3fb950";
            res.innerText = "Account created! Redirecting to login...";
            setTimeout(showLogin, 2000);
        } catch (e) {
            res.style.color = "#f85149";
            res.innerText = e.message;
        }
    };

    // Password Recovery
    async function forgotPass() {
        const email = document.getElementById('loginEmail').value;
        if (!email) return alert("Enter your email in the login box first.");
        try {
            await account.createRecovery(email, window.location.href);
            alert("Recovery link sent to your email.");
        } catch (e) { alert(e.message); }
    }
</script>
</body>
</html>
