<!DOCTYPE html>
<html>
<head>
  <title>Mileage Lock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; 
      background: #ffffff;
      color: #1c1e21;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .back-arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 28px;
      color: #1c1e21;
      cursor: pointer;
      font-weight: 300;
    }
    .container { 
      width: 100%;
      max-width: 396px; 
      margin-top: 50px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .logo {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 35px auto;
      mix-blend-mode: multiply;
    }
    .logo img {
      width: 100%;
      height: auto;
    }
    input { 
      width: 100%;
      padding: 16px 18px; 
      margin-bottom: 12px; 
      font-size: 17px; 
      border-radius: 12px; 
      border: 1px solid #dddfe2; 
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px #e7f3ff;
    }
    input::placeholder {
      color: #8a8d91;
    }
    .login-btn { 
      background: #1877f2; 
      color: white; 
      cursor: pointer; 
      font-weight: 600; 
      padding: 14px 16px; 
      margin-top: 8px;
      font-size: 20px; 
      width: 100%; 
      border-radius: 12px; 
      border: none;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: #166fe5;
    }
    .login-btn:active {
      transform: scale(0.98);
    }
    #result { 
      margin-top: 14px; 
      font-weight: 500; 
      min-height: 20px;
      text-align: center;
      font-size: 15px;
    }
    .forgot-link {
      color: #1877f2;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      margin-top: 18px;
      display: inline-block;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .spacer {
      flex: 1;
    }
    .gc-link {
      display: block;
      width: 100%;
      padding: 14px 16px;
      background: #ffffff;
      color: #1877f2;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 17px;
      border: 1px solid #1877f2;
      text-align: center;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .gc-link:hover {
      background: #f0f8ff;
    }
    .footer-note {
      font-size: 13px;
      color: #8a8d91;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .footer-note strong {
      color: #1c1e21;
    }
  </style>
</head>
<body>
  <div class="back-arrow">‹</div>
  
  <div class="container">

    <div
