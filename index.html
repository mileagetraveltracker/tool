<!DOCTYPE html>
<html>
<head>
<title>Mileage Private Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
    height: 100%; 
    width: 100%; 
    overflow-x: hidden;
    overflow-y: auto;
}
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; 
    background: #000000; 
    color: #e6edf3; 
    min-height: 100vh; 
    min-height: 100dvh;
    width: 100vw;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 0;
    position: relative; 
}

.highway-bg { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh; 
    z-index: 0; 
    background: #000000; 
    overflow: hidden; 
}
.road-container { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    perspective: 500px; 
}
.road { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%); 
    transform: rotateX(60deg); 
    transform-origin: center bottom;
}
.lane-lines { 
    position: absolute; 
    bottom: -50%; 
    left: 50%; 
    width: 20px; 
    height: 250%; 
    background: repeating-linear-gradient(to top, transparent 0px, transparent 30px, #ffffff 30px, #ffffff 70px); 
    animation: moveRoad 0.25s linear infinite; 
}
@keyframes moveRoad { 
    0% { transform: translateX(-50%) translateY(0); } 
    100% { transform: translateX(-50%) translateY(70px); } 
}

.container { 
    width: 100%; 
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 100vw;
    text-align: center; 
    position: relative; 
    z-index: 10; 
    display: flex; 
    flex-direction: column; 
    justify-content: center;
    gap: 8px; 
    padding: 20px;
    margin: 0 auto;
    background: rgba(0, 0, 0, 0.85);
}

.form-wrapper {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    padding: 0 12px;
}

.logo { 
    width: 100%; 
    max-width: 260px; 
    max-height: 20vh;
    margin: -10px auto 18px auto;
    padding: 14px; 
    background: #ffffff; 
    border-radius: 16px; 
    box-shadow: 0 8px 40px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
}
.logo img { 
    width: 100%; 
    height: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block; 
}

.input-group { position: relative; width: 100%; }
.input-group .input-icon { 
    position: absolute; 
    left: 14px; 
    top: 50%; 
    transform: translateY(-50%); 
    color: #6e7681; 
    font-size: 14px; 
    pointer-events: none; 
    z-index: 2;
}
input, textarea { 
    width: 100%; 
    padding: 13px 46px 13px 42px; 
    font-size: 15px; 
    border-radius: 10px; 
    border: 1px solid #30363d; 
    background: rgba(22,27,34,0.95); 
    color: #e6edf3; 
    outline: none; 
    font-family: inherit;
    position: relative;
    z-index: 1;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,0.15); }
input::placeholder, textarea::placeholder { color: #6e7681; }

.password-toggle {
    position: absolute; 
    right: 14px; 
    top: 50%; 
    transform: translateY(-50%); 
    cursor: pointer; 
    color: #6e7681; 
    z-index: 10;
    padding: 6px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
.password-toggle:active {
    transform: translateY(-50%) scale(0.9);
    color: #58a6ff;
}

.dispatch-btn { 
    appearance: none;
    border: 0;
    background: #1a1a1a;
    position: relative;
    height: 50px;
    width: auto;
    min-width: 180px;
    padding: 0 24px;
    margin: 0 auto 6px auto;
    outline: none;
    cursor: pointer;
    border-radius: 32px;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    transition: transform .3s ease;
    border: 1px solid #30363d;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
.dispatch-btn:active { transform: scale(0.98); }
.dispatch-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* FIXED: MALAKING HEADLIGHTS NA KAMUKHA NG PIC MO */
.dispatch-btn .car {
    position: absolute;
    left: -50px;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 26px;
    background: #1e293b;
    border-radius: 4px;
    transition: left 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 3;
    opacity: 0;
    box-shadow: inset -12px 0 0 #4a90e2;
}
.dispatch-btn .car::before {
    content: '';
    position: absolute;
    right: -4px;
    top: 4px;
    width: 7px;
    height: 7px;
    background: #ffeb3b;
    border-radius: 50%;
    box-shadow: 
        0 11px 0 #ffeb3b,
        0 0 15px 4px rgba(255,235,59,1),
        0 11px 15px 4px rgba(255,235,59,1),
        10px 0 25px 6px rgba(255,235,59,0.6),
        10px 11px 25px 6px rgba(255,235,59,0.6);
}
.dispatch-btn .car::after {
    content: '';
    position: absolute;
    left: 8px;
    top: 4px;
    width: 16px;
    height: 11px;
    background: #4a90e2;
    border-radius: 2px 0 0 2px;
}

.dispatch-btn .road-dash {
    position: absolute;
    top: 50%;
    left: 12px;
    right: 12px;
    height: 3px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(to right, transparent 0px, transparent 6px, #ffffff 6px, #ffffff 12px);
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 2;
}
.dispatch-btn .btn-text {
    position: relative;
    z-index: 4;
    color: white;
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100%;
    transition: opacity 0.3s;
}

.dispatch-btn.loading .car {
    left: 12px;
    opacity: 1;
    animation: carDrive 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
.dispatch-btn.loading .road-dash {
    opacity: 1;
    animation: roadMove 0.3s linear infinite;
}
.dispatch-btn.loading .btn-text {
    opacity: 0;
}

@keyframes carDrive {
    0% { left: 12px; }
    100% { left: calc(100% - 60px); }
}
@keyframes roadMove {
    0% { background-position: 0 0; }
    100% { background-position: 12px 0; }
}

#result, #signupResult, #resetResult, #contactResult { 
    font-weight: 500; 
    min-height: 16px; 
    text-align: center; 
    font-size: 12px; 
    margin-top: 2px; 
}

.link-btn { 
    color: #58a6ff; 
    font-size: 13px; 
    cursor: pointer; 
    padding: 7px 4px; 
    user-select: none; 
    -webkit-tap-highlight-color: transparent; 
    text-align: center; 
    line-height: 1.3;
    position: relative;
    z-index: 1;
}
.link-btn:active { opacity: 0.7; }

.link-btn.support {
    color: #7d8590;
    font-size: 12px;
}

.hidden { display: none !important; }
.form-box { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
.support-email { color: #7d8590; font-size: 11px; margin-top: 6px; }
.links-container { display: flex; flex-direction: column; gap: 0px; margin-top: -2px; width: 100%; }

@media (min-width: 768px) {
    .form-wrapper { max-width: 380px; }
    .logo { max-width: 280px; max-height: 180px; margin: 0 auto 20px auto; }
    .link-btn { font-size: 14px; }
    .link-btn.support { font-size: 13px; }
}

@media (max-height: 600px) and (orientation: landscape) {
    .container {
        justify-content: flex-start;
        padding-top: 20px;
        padding-bottom: 20px;
    }
    .logo { 
        max-width: 200px;
        max-height: 16vh; 
        padding: 10px;
        margin: -5px auto 12px auto;
    }
    .form-box { gap: 8px; }
    input { padding: 11px 46px 11px 42px; font-size: 14px; }
    .dispatch-btn { height: 46px; min-width: 160px; }
    .link-btn { padding: 5px 4px; font-size: 12px; }
    .link-btn.support { font-size: 11px; }
}

@media (max-height: 450px) {
    .container { padding-top: 15px; }
    .logo { 
        max-width: 160px;
        max-height: 14vh; 
        padding: 8px;
        margin: 0 auto 8px auto;
    }
    .form-box { gap: 6px; }
    input { padding: 10px 46px 10px 42px; font-size: 13px; }
    .dispatch-btn { height: 44px; min-width: 150px; }
}
</style>
</head>
<body>
<div class="highway-bg">
    <div class="road-container">
        <div class="road">
            <div class="lane-lines"></div>
        </div>
    </div>
</div>

<div class="container">
    <div class="form-wrapper">

        <div class="logo">
            <img src="./logo.PNG" alt="Mileage Logo">
        </div>

        <div id="loginForm" class="form-box">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
                <i class="fa-solid fa-envelope input-icon"></i>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <i class="fa-solid fa-lock input-icon"></i>
                <div class="password-toggle" id="loginPasswordToggle">
                    <i class="fa-solid fa-lock" id="login-password-icon"></i>
                </div>
            <button class="dispatch-btn" id="loginBtn">
                <div class="car"></div>
                <div class="road-dash"></div>
                <div class="btn-text">
                    <i class="fa-solid fa-right-to-bracket"></i> LOG IN
                </div>
            </button>
            <div id="result"></div>

            <div class="links-container">
                <p class="link-btn" onclick="showSignup()">
                    <i class="fa-solid fa-user-plus"></i> Don't have account? Create One
                </p>
                
                <p class="link-btn" onclick="forgotPass()">
                    <i class="fa-solid fa-key"></i> Forgot Password?
                </p>
                
                <p class="link-btn support" onclick="showContact()">
                    <i class="fa-solid fa-headset"></i> I don't have access to email, contact support
                </p>
            </div>
        </div>

        <div id="signupForm" class="form-box hidden">
            <div class="input-group">
                <input type="text" id="signupName" placeholder="Full Name" autocomplete="name">
                <i class="fa-solid fa-user input-icon"></i>
            </div>
            <div class="input-group">
                <input type="email" id="signupEmail" placeholder="Email Address" autocomplete="email">
                <i class="fa-solid fa-envelope input-icon"></i>
            </div>
            <div class="input-group">
                <input type="password" id="signupPassword" placeholder="Password (min 8 chars)" autocomplete="new-password">
                <i class="fa-solid fa-lock input-icon"></i>
                <div class="password-toggle" id="signupPasswordToggle">
                    <i class="fa-solid fa-lock" id="signup-password-icon"></i>
                </div>
            <button class="dispatch-btn" id="signupBtn">
                <div class="car"></div>
                <div class="road-dash"></div>
                <div class="btn-text">
                    <i class="fa-solid fa-user-plus"></i> CREATE ACCOUNT
                </div>
            </button>
            <div id="signupResult"></div>
            <p class="link-btn" onclick="showLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Already have account? Log in
            </p>
        </div>

        <div id="resetForm" class="form-box hidden">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New Password (min 8 chars)" autocomplete="new-password">
                <i class="fa-solid fa-lock input-icon"></i>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" autocomplete="new-password">
                <i class="fa-solid fa-lock input-icon"></i>
            </div>
            <button class="dispatch-btn" id="resetBtn">
                <div class="car"></div>
                <div class="road-dash"></div>
                <div class="btn-text">
                    <i class="fa-solid fa-check"></i> UPDATE PASSWORD
                </div>
            </button>
            <div id="resetResult"></div>
        </div>

        <div id="contactForm" class="form-box hidden">
            <div class="input-group">
                <input type="text" id="contactName" placeholder="Your Name" autocomplete="name">
                <i class="fa-solid fa-user input-icon"></i>
            </div>
            <div class="input-group">
                <input type="email" id="contactEmail" placeholder="Your Email" autocomplete="email">
                <i class="fa-solid fa-envelope input-icon"></i>
            </div>
            <div class="input-group">
                <input type="text" id="contactSubject" placeholder="Subject" autocomplete="off">
                <i class="fa-solid fa-tag input-icon"></i>
            </div>
            <div class="input-group">
                <textarea id="contactMessage" placeholder="Your message..." autocomplete="off"></textarea>
                <i class="fa-solid fa-message input-icon" style="top: 24px;"></i>
            </div>
            <button class="dispatch-btn" id="contactBtn">
                <div class="car"></div>
                <div class="road-dash"></div>
                <div class="btn-text">
                    <i class="fa-solid fa-paper-plane"></i> SEND MESSAGE
                </div>
            </button>
            <div id="contactResult"></div>
            <p class="support-email">Or email us directly: helpcenter.mileage@gmail.com</p>
            <p class="link-btn" onclick="showLogin()">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </p>
        </div>

    </div>
</div>

<script>
// ====== CONFIG ======
const PROJECT_ID = 'mileagelock'; 
const API_ENDPOINT = 'https://nyc.cloud.appwrite.io/v1';
const REDIRECT_URL = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";
const RECOVERY_URL = window.location.origin + window.location.pathname;
const SUPPORT_EMAIL = "helpcenter.mileage@gmail.com";
// ====================

const { Client, Account, ID } = Appwrite;
const client = new Client().setEndpoint(API_ENDPOINT).setProject(PROJECT_ID);
const account = new Account(client);

window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');
    if (userId && secret) {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('resetForm').classList.remove('hidden');
        document.getElementById('contactForm').classList.add('hidden');
    } else {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('resetForm').classList.add('hidden');
        document.getElementById('contactForm').classList.add('hidden');
    }
    
    setupPasswordToggle('loginPassword', 'loginPasswordToggle', 'login-password-icon');
    setupPasswordToggle('signupPassword', 'signupPasswordToggle', 'signup-password-icon');
});

function setupPasswordToggle(inputId, toggleId, iconId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    toggle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-lock');
            icon.classList.add('fa-lock-open');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-lock-open');
            icon.classList.add('fa-lock');
        }
        input.focus();
    });
}

function showLogin() {
    window.history.replaceState({}, document.title, window.location.pathname);
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('signupForm').classList.add('hidden');
    document.getElementById('resetForm').classList.add('hidden');
    document.getElementById('contactForm').classList.add('hidden');
    document.getElementById('result').innerHTML = '';
    document.getElementById('signupResult').innerHTML = '';
    document.getElementById('contactResult').innerHTML = '';
    
    const loginBtn = document.getElementById('loginBtn');
    loginBtn.disabled = false;
    loginBtn.classList.remove('loading');
}

function showSignup() {
    window.history.replaceState({}, document.title, window.location.pathname);
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('signupForm').classList.remove('hidden');
    document.getElementById('resetForm').classList.add('hidden');
    document.getElementById('contactForm').classList.add('hidden');
    document.getElementById('result').innerHTML = '';
    document.getElementById('signupResult').innerHTML = '';
}

function showContact() {
    window.history.replaceState({}, document.title, window.location.pathname);
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('signupForm').classList.add('hidden');
    document.getElementById('resetForm').classList.add('hidden');
    document.getElementById('contactForm').classList.remove('hidden');
    document.getElementById('contactResult').innerHTML = '';
}

document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('loginBtn');
    if (!email || !password) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Fill all fields';
        resultDiv.style.color = "#f85149";
        return;
    }
    btn.disabled = true;
    btn.classList.add('loading');
    resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Dispatching...';
    resultDiv.style.color = "#7d8590";
    try {
        await account.deleteSessions().catch(() => {});
        await account.createEmailSession(email, password);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Access Granted';
        resultDiv.style.color = "#3fb950";
        setTimeout(() => window.location.href = REDIRECT_URL, 1000);
    } catch (error) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Wrong email or password';
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
        btn.classList.remove('loading');
    }
};

document.getElementById('signupBtn').onclick = async () => {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const resultDiv = document.getElementById('signupResult');
    const btn = document.getElementById('signupBtn');
    if (!name || !email || !password) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Fill all fields';
        resultDiv.style.color = "#f85149";
        return;
    }
    if (password.length < 8) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Password min 8 characters';
        resultDiv.style.color = "#f85149";
        return;
    }
    btn.disabled = true;
    btn.classList.add('loading');
    resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account...';
    resultDiv.style.color = "#7d8590";
    try {
        await account.create(ID.unique(), email, password, name);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Account created! Please log in';
        resultDiv.style.color = "#3fb950";
        setTimeout(() => {
            showLogin();
            document.getElementById('loginEmail').value = email;
            document.getElementById('result').innerHTML = '<i class="fa-solid fa-circle-check"></i> Account created! Enter password to log in';
            document.getElementById('result').style.color = "#3fb950";
        }, 2000);
    } catch (error) {
        resultDiv.innerHTML = error.message.includes('already exists') ? '<i class="fa-solid fa-circle-xmark"></i> Email already used' : '<i class="fa-solid fa-circle-xmark"></i> ' + error.message;
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
        btn.classList.remove('loading');
    }
};

async function forgotPass() {
    const email = document.getElementById('loginEmail').value.trim();
    const resultDiv = document.getElementById('result');
    if (!email) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Enter your email first';
        resultDiv.style.color = "#f85149";
        return;
    }
    resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sending reset link...';
    resultDiv.style.color = "#7d8590";
    try {
        await account.createRecovery(email, RECOVERY_URL);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Reset link sent to email';
        resultDiv.style.color = "#3fb950";
    } catch (error) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Error: ' + error.message;
        resultDiv.style.color = "#f85149";
    }
}

document.getElementById('resetBtn').onclick = async () => {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const resultDiv = document.getElementById('resetResult');
    const btn = document.getElementById('resetBtn');
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');
    if (!newPass || !confirmPass) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Fill all fields';
        resultDiv.style.color = "#f85149";
        return;
    }
    if (newPass.length < 8) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Password min 8 characters';
        resultDiv.style.color = "#f85149";
        return;
    }
    if (newPass !== confirmPass) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Passwords do not match';
        resultDiv.style.color = "#f85149";
        return;
    }
    btn.disabled = true;
    btn.classList.add('loading');
    resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Updating password...';
    resultDiv.style.color = "#7d8590";
    try {
        await account.updateRecovery(userId, secret, newPass, confirmPass);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Password updated! Please log in';
        resultDiv.style.color = "#3fb950";
        setTimeout(() => {
            window.history.replaceState({}, document.title, window.location.pathname);
            showLogin();
            document.getElementById('result').innerHTML = '<i class="fa-solid fa-circle-check"></i> Password updated! Please log in';
            document.getElementById('result').style.color = "#3fb950";
        }, 2000);
    } catch (error) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Error: ' + error.message;
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
        btn.classList.remove('loading');
    }
};

document.getElementById('contactBtn').onclick = async () => {
    const name = document.getElementById('contactName').value.trim();
    const email = document.getElementById('contactEmail').value.trim();
    const subject = document.getElementById('contactSubject').value.trim();
    const message = document.getElementById('contactMessage').value.trim();
    const resultDiv = document.getElementById('contactResult');
    const btn = document.getElementById('contactBtn');

    if (!name || !email || !subject || !message) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Fill all fields';
        resultDiv.style.color = "#f85149";
        return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sending message...';
    resultDiv.style.color = "#7d8590";

    try {
        const response = await fetch('https://formsubmit.co/ajax/' + SUPPORT_EMAIL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                name: name,
                email: email,
                _subject: '[MileageLock Support] ' + subject,
                message: message,
                _captcha: 'false',
                _template: 'table'
            })
        });

        const data = await response.json();
        
        if (data.success === "true" || response.ok) {
            resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Message sent! We will reply to your email soon.';
            resultDiv.style.color = "#3fb950";
            document.getElementById('contactName').value = '';
            document.getElementById('contactEmail').value = '';
            document.getElementById('contactSubject').value = '';
            document.getElementById('contactMessage').value = '';
        } else {
            throw new Error('Failed');
        }
    } catch (error) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Failed to send. Email us directly at ' + SUPPORT_EMAIL;
        resultDiv.style.color = "#f85149";
    }
    
    btn.disabled = false;
    btn.classList.remove('loading');
};
</script>
</body>
</html>
