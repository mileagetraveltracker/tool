<!DOCTYPE html>
<html>
<head>
  <title>Mileage Lock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      font-family: Arial; 
      background: #0a0a0a; 
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { 
      width: 100%;
      max-width: 400px; 
      background: #1a1a1a; 
      padding: 30px; 
      border-radius: 10px;
      text-align: center;
    }
    h1 {
      color: #FF0000;
      font-weight: 900;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255,0,0,0.5);
      text-align: center;
    }
    p {
      margin-bottom: 15px;
      text-align: center;
    }
    input { 
      padding: 15px; 
      margin: 10px 0; 
      font-size: 16px; 
      width: 100%; 
      border-radius: 5px; 
      border: none; 
      text-align: center;
    }
    input::placeholder {
      text-align: center;
    }
    button { 
      background: #FF0000; 
      color: white; 
      cursor: pointer; 
      font-weight: bold; 
      text-align: center;
      padding: 15px; 
      margin: 10px 0 5px 0; 
      font-size: 16px; 
      width: 100%; 
      border-radius: 1px; 
      border: none;
    }
    button:hover {
      background: #CC0000;
    }
    #result { 
      margin-top: 10px; 
      font-weight: bold; 
      min-height: 24px;
      text-align: center;
    }
    .gc-link {
      display: inline-block;
      margin-top: 5px;
      padding: 15px;
      background: #0084FF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 16px;
      width: 100%;
      text-align: center;
    }
    .gc-link:hover {
      background: #0066CC;
    }
    .note { 
      font-size: 12px; 
      color: #888; 
      margin-top: 15px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MILEAGE PRIVATE TOOL</h1>
    <p>Enter password to access</p>
    <input type="password" id="passkey" placeholder="Enter Password" autocomplete="off">
    <button onclick="checkPass()">UNLOCK TO ACCESS</button>
    <div id="result"></div>
    
    <a href="https://m.me/j/AbYpGq-yLGpGvqNK/?send_source=gc:copy_invite_link_c" 
       class="gc-link" 
       target="_blank">
       CLICK TO GET PASSWORD
    </a>
    
    <p class="note">
      Password expires monthly.<br>
      or message @CharlsDarwin to get password
    </p>
  </div>

  <!-- IPHONE NOTIFICATION SOUND -->
  <audio id="successSound" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_ad4f6752d8.mp3" type="audio/mpeg">
  </audio>

  <script>
    async function checkPass() {
      const passkey = document.getElementById('passkey').value.trim();
      const resultDiv = document.getElementById('result');
      const sound = document.getElementById('successSound');
      
      if (!passkey) {
        resultDiv.innerHTML = "⚠️ Please enter a password";
        resultDiv.style.color = "#ff0";
        return;
      }

      resultDiv.innerHTML = "Verifying...";
      resultDiv.style.color = "#fff";
      
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passkey })
        });
        
        const data = await res.json();
        
        if (res.status === 200) {
          resultDiv.innerHTML = "✅ ACCESS GRANTED! REDIRECTING...";
          resultDiv.style.color = "#0f0";
          
          sound.volume = 1.0;
          sound.currentTime = 0;
          sound.play().catch(e => console.log("Sound blocked"));
          
          setTimeout(() => {
            window.location.href = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";
          }, 1500);
        } else {
          resultDiv.innerHTML = "❌ " + data.error;
          resultDiv.style.color = "#f00";
        }
      } catch (error) {
        resultDiv.innerHTML = "❌ Server error. Try again.";
        resultDiv.style.color = "#f00";
      }
    }

    document.getElementById('passkey').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPass();
    });
  </script>
</body>
</html>
