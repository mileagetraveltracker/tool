<!DOCTYPE html>
<html>
<head>
  <title>Mileage Private Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; 
      background: #000000; 
      color: #e6edf3; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
      position: relative;
    }
    
    /* ROAD ANIMATION BACKGROUND */
    .highway-bg { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      z-index: 0; 
      background: #000000; 
      overflow: hidden; 
    }
    .road-container { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      perspective: 500px; 
    }
    .road { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%); 
      transform: rotateX(60deg); 
      transform-origin: center bottom; 
    }
    .lane-lines { 
      position: absolute; 
      bottom: -50%; left: 50%; 
      width: 20px; height: 250%; 
      background: repeating-linear-gradient(to top, transparent 0px, transparent 30px, #ffffff 30px, #ffffff 70px); 
      animation: moveRoad 0.25s linear infinite; 
      will-change: transform; 
    }
    @keyframes moveRoad { 
      0% { transform: translateX(-50%) translateY(0); } 
      100% { transform: translateX(-50%) translateY(70px); } 
    }
    .overlay { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.8); 
      z-index: 1; 
    }
    
    /* MAIN CONTAINER - NAKA CENTER LAHAT */
    .container { 
      width: 100%; 
      max-width: 380px; 
      text-align: center; 
      position: relative; 
      z-index: 3; 
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    /* LOGO */
    .logo { 
      width: 100%; 
      max-width: 260px; 
      margin: 0 auto 8px auto; 
      padding: 16px; 
      background: #ffffff; 
      border-radius: 16px; 
      box-shadow: 0 8px 40px rgba(0,0,0,0.9); 
      animation: logoPop 0.6s ease-out; 
    }
    @keyframes logoPop { 
      0% { opacity: 0; transform: scale(0.8); } 
      100% { opacity: 1; transform: scale(1); } 
    }
    .logo img { width: 100%; height: auto; display: block; }
    
    /* INPUT WITH ICON */
    .input-group {
      position: relative;
      width: 100%;
    }
    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #6e7681;
      font-size: 16px;
      z-index: 2;
    }
    input { 
      width: 100%; 
      padding: 14px 16px 14px 48px; 
      font-size: 16px; 
      border-radius: 12px; 
      border: 1px solid #30363d; 
      background: rgba(22,27,34,0.95); 
      color: #e6edf3; 
      outline: none; 
      transition: all 0.2s; 
      backdrop-filter: blur(10px); 
    }
    input:focus { 
      border-color: #1f6feb; 
      box-shadow: 0 0 0 3px rgba(31,111,235,0.15); 
    }
    input:focus + i { color: #1f6feb; }
    input::placeholder { color: #6e7681; }
    
    /* BUTTON */
    .login-btn { 
      background: #238636; 
      color: white; 
      cursor: pointer; 
      font-weight: 600; 
      padding: 14px; 
      margin-top: 4px; 
      font-size: 16px; 
      width: 100%; 
      border-radius: 12px; 
      border: none; 
      transition: all 0.2s; 
      box-shadow: 0 4px 20px rgba(35,134,54,0.4); 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover { background: #2ea043; transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    /* TEXT & LINKS */
    #result, #signupResult { 
      margin-top: 4px; 
      font-weight: 500; 
      min-height: 20px; 
      text-align: center; 
      font-size: 14px; 
    }
    .toggle-form, .forgot { 
      color: #58a6ff; 
      font-size: 14px; 
      cursor: pointer; 
      margin-top: 12px;
      transition: all 0.2s;
    }
    .toggle-form:hover, .forgot:hover { 
      text-decoration: underline; 
      color: #79c0ff;
    }
    .hidden { display: none; }
    
    /* FORM CONTAINER */
    .form-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="highway-bg">
    <div class="road-container">
      <div class="road">
        <div class="lane-lines"></div>
      </div>
    </div>
  <div class="overlay"></div>
  
  <div class="container">
    <div class="logo">
      <img src="./logo.PNG" alt="Mileage Logo">
    </div>
    
    <!-- LOGIN FORM -->
    <div id="loginForm" class="form-box">
      <div class="input-group">
        <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="input-group">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <i class="fa-solid fa-lock"></i>
      </div>
      <button class="login-btn" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i>
        LOG IN
      </button>
      <div id="result"></div>
      <p class="forgot" onclick="forgotPass()">
        <i class="fa-solid fa-key"></i> Forgot Password?
      </p>
      <p class="toggle-form" onclick="toggleForms()">
        <i class="fa-solid fa-user-plus"></i> Don't have account? Create one
      </p>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="form-box hidden">
      <div class="input-group">
        <input type="text" id="signupName" placeholder="Full Name" autocomplete="name">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="input-group">
        <input type="email" id="signupEmail" placeholder="Email Address" autocomplete="email">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="input-group">
        <input type="password" id="signupPassword" placeholder="Password (min 8 chars)" autocomplete="new-password">
        <i class="fa-solid fa-lock"></i>
      </div>
      <button class="login-btn" id="signupBtn">
        <i class="fa-solid fa-user-plus"></i>
        CREATE ACCOUNT
      </button>
      <div id="signupResult"></div>
      <p class="toggle-form" onclick="toggleForms()">
        <i class="fa-solid fa-right-to-bracket"></i> Already have account? Log in
      </p>
    </div>
  </div>

  <script>
    const PROJECT_ID = 'mileagelock';
    const API_ENDPOINT = 'https://nyc.cloud.appwrite.io/v1';
    const REDIRECT_URL = "https://charlsdarwin2004.github.io/mileageprivatetools/?k=CharlsDarwin-999&t=TestTokenNaMahaba1234563";
    
    const { Client, Account, ID } = Appwrite;
    const client = new Client().setEndpoint(API_ENDPOINT).setProject(PROJECT_ID);
    const account = new Account(client);

    // Auto redirect pag naka-login na
    account.get().then(() => {
      window.location.href = REDIRECT_URL;
    }).catch(() => {});

    // LOGIN
    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Fill all fields';
        resultDiv.style.color = "#f85149";
        return;
      }
      
      btn.disabled = true;
      resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';
      resultDiv.style.color = "#7d8590";
      
      try {
        await account.createEmailPasswordSession(email, password);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Access Granted';
        resultDiv.style.color = "#3fb950";
        setTimeout(() => window.location.href = REDIRECT_URL, 800);
      } catch (error) {
        console.log(error);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Wrong email or password';
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
      }
    };

    // SIGNUP
    document.getElementById('signupBtn').onclick = async () => {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const resultDiv = document.getElementById('signupResult');
      const btn = document.getElementById('signupBtn');
      
      if (!name || !email || !password) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Fill all fields';
        resultDiv.style.color = "#f85149";
        return;
      }
      
      if (password.length < 8) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Password min 8 characters';
        resultDiv.style.color = "#f85149";
        return;
      }
      
      btn.disabled = true;
      resultDiv.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account...';
      resultDiv.style.color = "#7d8590";
      
      try {
        await account.create(ID.unique(), email, password, name);
        await account.createEmailPasswordSession(email, password);
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Account created!';
        resultDiv.style.color = "#3fb950";
        setTimeout(() => window.location.href = REDIRECT_URL, 800);
      } catch (error) {
        console.log(error);
        resultDiv.innerHTML = error.message.includes('already exists') 
          ? '<i class="fa-solid fa-circle-xmark"></i> Email already used' 
          : '<i class="fa-solid fa-circle-xmark"></i> ' + error.message;
        resultDiv.style.color = "#f85149";
        btn.disabled = false;
      }
    };

    // FORGOT PASSWORD
    async function forgotPass() {
      const email = document.getElementById('loginEmail').value;
      const resultDiv = document.getElementById('result');
      
      if (!email) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Enter your email first';
        resultDiv.style.color = "#f85149";
        return;
      }
      
      try {
        await account.createRecovery(email, 'https://mileage-lock.vercel.app');
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Reset link sent to email';
        resultDiv.style.color = "#3fb950";
      } catch (error) {
        resultDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Error: ' + error.message;
        resultDiv.style.color = "#f85149";
      }
    }

    // TOGGLE LOGIN/SIGNUP
    function toggleForms() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('signupForm').classList.toggle('hidden');
      document.getElementById('result').innerHTML = '';
      document.getElementById('signupResult').innerHTML = '';
    }

    // ENTER KEY SUPPORT
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (!document.getElementById('loginForm').classList.contains('hidden')) {
          document.getElementById('loginBtn').click();
        } else {
          document.getElementById('signupBtn').click();
        }
      }
    });
  </script>
</body>
</html>
